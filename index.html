<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Login & Sign Up</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

.container {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    padding: 35px 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
}

.title {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
    transition: 0.2s;
    background: #ffffff;
}

.input-group input:focus {
    border-color: #16a34a;
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.10);
}

button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 5px;
    transition: 0.2s;
}

button:hover {
    background: #15803d;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.switch-text {
    margin-top: 22px;
    text-align: center;
    font-size: 14px;
    color: #6b7280;
}

.switch-text span {
    color: #16a34a;
    font-weight: 600;
    cursor: pointer;
}

.message {
    display: none;
    padding: 11px 13px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 17px;
}

.message.error {
    display: block;
    color: #b91c1c;
    background: #fee2e2;
}

.message.success {
    display: block;
    color: #166534;
    background: #dcfce7;
}

#signupForm {
    display: none;
}

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .container {
        padding: 30px 22px;
        border-radius: 15px;
    }

    .title {
        font-size: 26px;
    }

}

</style>

</head>

<body>

<div class="container">


    <!-- ========================= -->
    <!-- LOGIN FORM -->
    <!-- ========================= -->

    <div id="loginForm">

        <h1 class="title">Login</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <div
            id="loginMessage"
            class="message">
        </div>


        <form onsubmit="login(event)">


            <div class="input-group">

                <label>Name</label>

                <input
                    type="text"
                    id="loginName"
                    placeholder="Enter your name"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <div class="switch-text">

            Don't have an account?

            <span onclick="showSignup()">
                Sign Up
            </span>

        </div>


    </div>



    <!-- ========================= -->
    <!-- SIGNUP FORM -->
    <!-- ========================= -->

    <div id="signupForm">


        <h1 class="title">
            Sign Up
        </h1>


        <p class="subtitle">
            Create your account
        </p>


        <div
            id="signupMessage"
            class="message">
        </div>


        <form onsubmit="signup(event)">


            <!-- NAME -->

            <div class="input-group">

                <label>Name</label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>



            <!-- MOBILE -->

            <div class="input-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    id="signupMobile"
                    placeholder="Enter 10 digit mobile number"
                    inputmode="numeric"
                    maxlength="10"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

            </div>



            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div class="switch-text">

            Already have an account?

            <span onclick="showLogin()">
                Login
            </span>

        </div>


    </div>


</div>



<!-- ======================================== -->
<!-- SUPABASE JAVASCRIPT -->
<!-- ======================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ============================================
// SUPABASE DETAILS
// ============================================


// REPLACE THIS
const SUPABASE_URL =
    "https://pvagpesejvoldwldmzhs.supabase.co/";


// REPLACE THIS
const SUPABASE_ANON_KEY =
    "sb_publishable_xCUj4SV7Wvapf8NkEMZHrg_zdDOwvDU";



const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



// ============================================
// SHOW SIGNUP
// ============================================

function showSignup() {

    document
        .getElementById("loginForm")
        .style.display = "none";


    document
        .getElementById("signupForm")
        .style.display = "block";


    clearMessages();

}



// ============================================
// SHOW LOGIN
// ============================================

function showLogin() {

    document
        .getElementById("signupForm")
        .style.display = "none";


    document
        .getElementById("loginForm")
        .style.display = "block";


    clearMessages();

}



// ============================================
// SIGNUP
// ============================================

async function signup(event) {

    event.preventDefault();


    const name =
        document
            .getElementById("signupName")
            .value
            .trim();


    const mobile =
        document
            .getElementById("signupMobile")
            .value
            .trim();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    const message =
        document
            .getElementById("signupMessage");


    const button =
        document
            .getElementById("signupButton");



    // ========================================
    // NAME VALIDATION
    // ========================================

    if (name.length < 2) {

        showMessage(
            message,
            "Please enter a valid name.",
            "error"
        );

        return;
    }



    // ========================================
    // MOBILE VALIDATION
    // ========================================

    if (!/^[0-9]{10}$/.test(mobile)) {

        showMessage(
            message,
            "Please enter a valid 10 digit mobile number.",
            "error"
        );

        return;
    }



    // ========================================
    // PASSWORD VALIDATION
    // ========================================

    if (password.length < 6) {

        showMessage(
            message,
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }



    // ========================================
    // CONFIRM PASSWORD
    // ========================================

    if (password !== confirmPassword) {

        showMessage(
            message,
            "Passwords do not match.",
            "error"
        );

        return;
    }



    // ========================================
    // BUTTON LOADING
    // ========================================

    button.disabled = true;

    button.textContent =
        "Creating Account...";



    showMessage(
        message,
        "Creating your account...",
        "success"
    );



    try {


        // ====================================
        // CALL SUPABASE SIGNUP FUNCTION
        // ====================================

        const { data, error } =
            await supabaseClient.rpc(
                "signup_user",
                {

                    p_name: name,

                    p_mobile: mobile,

                    p_password: password

                }
            );



        console.log(
            "Signup Data:",
            data
        );


        console.log(
            "Signup Error:",
            error
        );



        // ====================================
        // SUPABASE ERROR
        // ====================================

        if (error) {

            console.error(error);


            showMessage(
                message,
                error.message ||
                "Unable to create account.",
                "error"
            );


            return;
        }



        // ====================================
        // DATABASE FUNCTION ERROR
        // ====================================

        if (!data || data.success !== true) {

            showMessage(
                message,
                data?.message ||
                "Unable to create account.",
                "error"
            );


            return;
        }



        // ====================================
        // SIGNUP SUCCESS
        // ====================================

        showMessage(
            message,
            data.message ||
            "Account created successfully!",
            "success"
        );



        // ====================================
        // CLEAR SIGNUP FORM
        // ====================================

        document
            .getElementById("signupName")
            .value = "";


        document
            .getElementById("signupMobile")
            .value = "";


        document
            .getElementById("signupPassword")
            .value = "";


        document
            .getElementById("confirmPassword")
            .value = "";



        // ====================================
        // OPEN LOGIN PAGE
        // ====================================

        setTimeout(function () {

            showLogin();

        }, 1200);


    }
    catch (err) {


        console.error(
            "Signup Error:",
            err
        );


        showMessage(
            message,
            "Something went wrong. Please try again.",
            "error"
        );


    }
    finally {


        button.disabled = false;


        button.textContent =
            "Create Account";


    }

}



// ============================================
// LOGIN
// ============================================

async function login(event) {

    event.preventDefault();


    const name =
        document
            .getElementById("loginName")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const message =
        document
            .getElementById("loginMessage");


    const button =
        document
            .getElementById("loginButton");



    // ========================================
    // NAME CHECK
    // ========================================

    if (name === "") {

        showMessage(
            message,
            "Please enter your name.",
            "error"
        );

        return;
    }



    // ========================================
    // PASSWORD CHECK
    // ========================================

    if (password === "") {

        showMessage(
            message,
            "Please enter your password.",
            "error"
        );

        return;
    }



    // ========================================
    // BUTTON LOADING
    // ========================================

    button.disabled = true;


    button.textContent =
        "Logging in...";


    showMessage(
        message,
        "Checking your account...",
        "success"
    );



    try {


        // ====================================
        // CALL LOGIN FUNCTION
        // ====================================

        const { data, error } =
            await supabaseClient.rpc(
                "login_user",
                {

                    p_name: name,

                    p_password: password

                }
            );



        console.log(
            "Login Data:",
            data
        );


        console.log(
            "Login Error:",
            error
        );



        // ====================================
        // SUPABASE ERROR
        // ====================================

        if (error) {

            console.error(error);


            showMessage(
                message,
                error.message ||
                "Unable to login.",
                "error"
            );


            return;
        }



        // ====================================
        // WRONG LOGIN
        // ====================================

        if (!data || data.success !== true) {

            showMessage(
                message,
                data?.message ||
                "Invalid name or password.",
                "error"
            );


            return;
        }



        // ====================================
        // LOGIN SUCCESS
        // ====================================

        showMessage(
            message,
            data.message ||
            "Login successful!",
            "success"
        );



        // ====================================
        // SAVE USER DETAILS
        // ====================================

        localStorage.setItem(
            "loggedInUser",
            JSON.stringify(data.user)
        );


        localStorage.setItem(
            "isLoggedIn",
            "true"
        );


        localStorage.setItem(
            "userId",
            data.user.id
        );


        localStorage.setItem(
            "userName",
            data.user.name
        );


        localStorage.setItem(
            "userMobile",
            data.user.mobile
        );



        console.log(
            "Logged User:",
            data.user
        );



        // ====================================
        // REDIRECT AFTER LOGIN
        // ====================================

        setTimeout(function () {

            window.location.href =
                "home.html";

        }, 700);


    }
    catch (err) {


        console.error(
            "Login Error:",
            err
        );


        showMessage(
            message,
            "Something went wrong. Please try again.",
            "error"
        );


    }
    finally {


        button.disabled = false;


        button.textContent =
            "Login";


    }

}



// ============================================
// SHOW MESSAGE
// ============================================

function showMessage(
    element,
    text,
    type
) {

    element.textContent =
        text;


    element.className =
        "message " + type;

}



// ============================================
// CLEAR MESSAGE
// ============================================

function clearMessages() {


    const loginMessage =
        document
            .getElementById(
                "loginMessage"
            );


    const signupMessage =
        document
            .getElementById(
                "signupMessage"
            );



    loginMessage.className =
        "message";


    loginMessage.textContent =
        "";



    signupMessage.className =
        "message";


    signupMessage.textContent =
        "";

}



// ============================================
// MOBILE NUMBER - NUMBERS ONLY
// ============================================

document
    .getElementById("signupMobile")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 10);

        }
    );


</script>

</body>
</html>
