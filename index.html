<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>Login & Signup</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f5f3ff,
            #eff6ff
        );
}

.container {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.96);
    padding: 36px 28px;
    border-radius: 22px;

    box-shadow:
        0 20px 60px rgba(79,70,229,0.14);

    border:
        1px solid rgba(99,102,241,0.10);
}

.title {
    font-size: 30px;
    font-weight: 800;
    text-align: center;
    color: #312e81;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    height: 51px;
    padding: 0 15px;
    font-size: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: #f8fafc;
    outline: none;
    color: #0f172a;
    transition: 0.25s;
}

.input-group input::placeholder {
    color: #94a3b8;
}

.input-group input:focus {
    background: #ffffff;
    border-color: #6366f1;

    box-shadow:
        0 0 0 4px rgba(99,102,241,0.12);
}

button {
    width: 100%;
    height: 51px;
    border: none;
    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;

    box-shadow:
        0 8px 20px rgba(79,70,229,0.23);

    transition: 0.25s;
}

button:hover {
    transform: translateY(-1px);

    box-shadow:
        0 12px 26px rgba(79,70,229,0.28);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
}

.switch-text {
    text-align: center;
    margin-top: 23px;
    font-size: 14px;
    color: #64748b;
}

.switch-text span {
    color: #5b21b6;
    font-weight: 700;
    cursor: pointer;
}

.switch-text span:hover {
    text-decoration: underline;
}

.message {
    display: none;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 17px;
}

.message.success {
    display: block;
    color: #166534;
    background: #dcfce7;
    border: 1px solid #bbf7d0;
}

.message.error {
    display: block;
    color: #b91c1c;
    background: #fee2e2;
    border: 1px solid #fecaca;
}

.message.loading {
    display: block;
    color: #3730a3;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
}

#signupPage {
    display: none;
}

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .container {
        padding: 30px 22px;
        border-radius: 18px;
    }

    .title {
        font-size: 27px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- ============================= -->
    <!-- LOGIN PAGE -->
    <!-- ============================= -->

    <div id="loginPage">

        <h1 class="title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to continue
        </p>

        <div
            id="loginMessage"
            class="message">
        </div>

        <form onsubmit="login(event)">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div class="switch-text">

            Don't have an account?

            <span onclick="showSignup()">
                Sign Up
            </span>

        </div>

    </div>


    <!-- ============================= -->
    <!-- SIGNUP PAGE -->
    <!-- ============================= -->

    <div id="signupPage">

        <h1 class="title">
            Create Account
        </h1>

        <p class="subtitle">
            Sign up to get started
        </p>

        <div
            id="signupMessage"
            class="message">
        </div>

        <form onsubmit="signup(event)">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="signupUsername"
                    placeholder="Create your username"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Enter 10 digit phone number"
                    inputmode="numeric"
                    maxlength="10"
                    autocomplete="tel"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>

        </form>

        <div class="switch-text">

            Already have an account?

            <span onclick="showLogin()">
                Login
            </span>

        </div>

    </div>

</div>


<!-- ======================================= -->
<!-- SUPABASE JAVASCRIPT LIBRARY -->
<!-- ======================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

// =========================================================
// SUPABASE CONNECTION
// =========================================================
//
// REPLACE THESE TWO VALUES
//
// Example URL:
// https://abcdefgh.supabase.co
//
// Use ONLY publishable / anon key.
// NEVER put service_role key here.
//
// =========================================================

const SUPABASE_URL =
    "https://pvagpesejvoldwldmzhs.supabase.co/";

const SUPABASE_ANON_KEY =
    "sb_publishable_xCUj4SV7Wvapf8NkEMZHrg_zdDOwvDU";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


// =========================================================
// SHOW SIGNUP
// =========================================================

function showSignup() {

    document
        .getElementById("loginPage")
        .style.display = "none";

    document
        .getElementById("signupPage")
        .style.display = "block";

    clearMessages();
}


// =========================================================
// SHOW LOGIN
// =========================================================

function showLogin() {

    document
        .getElementById("signupPage")
        .style.display = "none";

    document
        .getElementById("loginPage")
        .style.display = "block";

    clearMessages();
}


// =========================================================
// SIGNUP
// =========================================================

async function signup(event) {

    event.preventDefault();


    const username =
        document
            .getElementById("signupUsername")
            .value
            .trim();


    const phone =
        document
            .getElementById("signupPhone")
            .value
            .trim();


    const password =
        document
            .getElementById("signupPassword")
            .value;


    const message =
        document
            .getElementById("signupMessage");


    const button =
        document
            .getElementById("signupButton");


    // =====================================================
    // USERNAME VALIDATION
    // =====================================================

    if (username.length < 3) {

        showMessage(
            message,
            "Username must contain at least 3 characters.",
            "error"
        );

        return;
    }


    // =====================================================
    // PHONE VALIDATION
    // =====================================================

    if (!/^[0-9]{10}$/.test(phone)) {

        showMessage(
            message,
            "Please enter a valid 10 digit phone number.",
            "error"
        );

        return;
    }


    // =====================================================
    // PASSWORD VALIDATION
    // =====================================================

    if (password.length < 6) {

        showMessage(
            message,
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    // =====================================================
    // START LOADING
    // =====================================================

    button.disabled = true;
    button.textContent = "Creating Account...";

    showMessage(
        message,
        "Please wait...",
        "loading"
    );


    try {

        // =================================================
        // CALL SUPABASE SIGNUP RPC
        // =================================================

        const { data, error } =
            await supabaseClient.rpc(

                "signup_user",

                {

                    p_username: username,

                    p_phone: phone,

                    p_password: password

                }

            );


        console.log(
            "Signup data:",
            data
        );


        console.log(
            "Signup error:",
            error
        );


        // =================================================
        // SUPABASE ERROR
        // =================================================

        if (error) {

            console.error(
                "Supabase signup error:",
                error
            );

            showMessage(
                message,
                error.message ||
                "Unable to create account.",
                "error"
            );

            return;
        }


        // =================================================
        // FUNCTION RETURNED ERROR
        // =================================================

        if (!data || data.success !== true) {

            showMessage(
                message,
                data?.message ||
                "Unable to create account.",
                "error"
            );

            return;
        }


        // =================================================
        // SUCCESS
        // =================================================

        showMessage(
            message,
            data.message ||
            "Account created successfully!",
            "success"
        );


        // CLEAR SIGNUP FORM

        document
            .getElementById("signupUsername")
            .value = "";


        document
            .getElementById("signupPhone")
            .value = "";


        document
            .getElementById("signupPassword")
            .value = "";


        // =================================================
        // OPEN LOGIN PAGE
        // =================================================

        setTimeout(function () {

            showLogin();

        }, 1200);

    }

    catch (err) {

        console.error(
            "Signup exception:",
            err
        );


        showMessage(
            message,
            "Unable to connect to the server.",
            "error"
        );

    }

    finally {

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

}


// =========================================================
// LOGIN
// =========================================================

async function login(event) {

    event.preventDefault();


    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const message =
        document
            .getElementById("loginMessage");


    const button =
        document
            .getElementById("loginButton");


    // =====================================================
    // USERNAME
    // =====================================================

    if (username === "") {

        showMessage(
            message,
            "Please enter your username.",
            "error"
        );

        return;
    }


    // =====================================================
    // PASSWORD
    // =====================================================

    if (password === "") {

        showMessage(
            message,
            "Please enter your password.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    showMessage(
        message,
        "Checking your account...",
        "loading"
    );


    try {

        // =================================================
        // CALL SUPABASE LOGIN RPC
        // =================================================

        const { data, error } =
            await supabaseClient.rpc(

                "login_user",

                {

                    p_username: username,

                    p_password: password

                }

            );


        console.log(
            "Login data:",
            data
        );


        console.log(
            "Login error:",
            error
        );


        // =================================================
        // SUPABASE ERROR
        // =================================================

        if (error) {

            console.error(
                "Supabase login error:",
                error
            );


            showMessage(
                message,
                error.message ||
                "Unable to login.",
                "error"
            );

            return;
        }


        // =================================================
        // WRONG USERNAME / PASSWORD
        // =================================================

        if (!data || data.success !== true) {

            showMessage(
                message,
                data?.message ||
                "Invalid username or password.",
                "error"
            );

            return;
        }


        // =================================================
        // LOGIN SUCCESS
        // =================================================

        showMessage(
            message,
            data.message ||
            "Login successful!",
            "success"
        );


        // =================================================
        // SAVE ONLY BASIC USER INFORMATION
        //
        // PASSWORD IS NOT SAVED
        // =================================================

        localStorage.setItem(
            "isLoggedIn",
            "true"
        );


        localStorage.setItem(
            "userId",
            data.user.id
        );


        localStorage.setItem(
            "username",
            data.user.username
        );


        localStorage.setItem(
            "phone",
            data.user.phone
        );


        localStorage.setItem(
            "loggedInUser",
            JSON.stringify(
                data.user
            )
        );


        // =================================================
        // REDIRECT AFTER LOGIN
        // =================================================

        setTimeout(function () {

            window.location.href =
                "home.html";

        }, 700);

    }

    catch (err) {

        console.error(
            "Login exception:",
            err
        );


        showMessage(
            message,
            "Unable to connect to the server.",
            "error"
        );

    }

    finally {

        button.disabled = false;

        button.textContent =
            "Login";

    }

}


// =========================================================
// SHOW MESSAGE
// =========================================================

function showMessage(
    element,
    text,
    type
) {

    element.textContent =
        text;

    element.className =
        "message " + type;

}


// =========================================================
// CLEAR MESSAGES
// =========================================================

function clearMessages() {

    const loginMessage =
        document
            .getElementById("loginMessage");


    const signupMessage =
        document
            .getElementById("signupMessage");


    loginMessage.className =
        "message";

    loginMessage.textContent =
        "";


    signupMessage.className =
        "message";

    signupMessage.textContent =
        "";

}


// =========================================================
// PHONE NUMBER - NUMBERS ONLY
// =========================================================

document
    .getElementById("signupPhone")
    .addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 10);

        }
    );

</script>

</body>
</html>
